# The press-refinement source: where the user's own OpenFlux finds the keyboard maker's
# press-refinement coefficients. OpenFlux never hosts or ships them. The daemon reads the member
# below out of one of the `sources` (the maker's published Windows package, with HTTP range
# requests, or a copy the user already has), places its UF2 blocks at their RP2040 addresses (one
# contiguous image from image_base), and takes the payload from the image's ranges, in order. The
# member, the image and the payload must each match their size and SHA-256, and a container
# downloaded whole must match its own, or nothing is installed. The release workflow records this
# table in the signed index next to the factory reference, so the sources can change without a new
# OpenFlux release.

[press_refinement_source]
description = "Factory software 1.5.0.5"
sources = [
    { kind = "container", url = "https://fluxkeyboard.com/updates-dev/polymath/windows/versions/1.5.0.5/polymath.msix", size = 168502476, sha256 = "14933b5622670754a5ee21033ab53e10999fec1197ab07dcd45c08fd05444ff4" },
]
member = "data/flutter_assets/assets/firmware/oates_1.5.5.D.uf2"
member_size = 308736
member_sha256 = "03f220630c24620790f57e3144f9238fe1082d1aa0e4bb3fc6cda7e83224e703"
image_base = 0x10000000
image_size = 154368
