[package]
name = "openflux-modules"
version = "2.0.0-alpha.1"
edition.workspace = true
description = "OpenFlux v2 unified module system: plain-folder manifests, Lua 5.4 runtime, disclosure inspector, curated lists, presets, and host runner"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
openflux-bus = { path = "../openflux-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
