[package]
name = "keyglass-compositor"
version = "2.0.0-alpha.1"
edition.workspace = true
description = "Keyglass v2 unified cross-platform wgpu layered GPU compositor (Metal, Vulkan, DX12, GLES)"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["wgpu-backend"]
wgpu-backend = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[dependencies]
bytemuck = { version = "1", features = ["derive"], optional = true }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyglass-bus = { path = "../keyglass-bus" }
keyglass-modules = { path = "../keyglass-modules" }
pollster = { version = "0.4", optional = true }
wgpu = { version = "23", features = ["glsl"], optional = true }
