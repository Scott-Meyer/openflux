[package]
name = "keyglass-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Keyglass release manifests, update trust and compatibility planning"
publish = false

[features]
default = ["cli"]
signing = []
# Refuse to build if keys/ holds a placeholder development key (see
# src/keys.rs). Enabled for releases.
production-keys = []
cli = ["signing", "dep:clap", "dep:ureq"]

[dependencies]
minisign = "0.10"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml = "0.8"
clap = { version = "4", features = ["derive"], optional = true }
ureq = { version = "3", optional = true }

[[bin]]
name = "keyglass-release"
path = "src/bin/keyglass-release.rs"
required-features = ["cli"]
