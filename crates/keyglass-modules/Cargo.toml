[package]
name = "keyglass-modules"
version = "2.0.0-alpha.1"
edition.workspace = true
description = "Keyglass v2 unified module system: plain-folder manifests, Lua 5.4 runtime, disclosure inspector, curated lists, presets, and host runner"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Host-side opt-in network capabilities (`net.http`, `net.tcp_*`) for modules that declare
# `[permissions] network = true`. Enabled ONLY in `keyglassd` (NEVER on `keyglass-display`).
host-net = ["dep:base64", "dep:reqwest", "dep:rustls", "dep:rustls-native-certs", "dep:webpki-roots"]

[dependencies]
base64 = { version = "0.22", optional = true }
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
keyglass-bus = { path = "../keyglass-bus" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
walkdir = "2"
webpki-roots = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
