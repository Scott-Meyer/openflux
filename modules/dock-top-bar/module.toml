id = "dock-top-bar"
name = "Top Bar Dock"
version = "2.0.0"
description = "Provides the top-bar widget slot layout, optional frosted module dimming backdrop for readability, and vertical slot dividers (pure module—fork or replace for custom layouts!)"
author = "OpenFlux"
category = "widget"
tags = ["core", "layout", "dock", "visibility", "dimming"]
stages = ["under_key"]
host_requirement = "none"
slot_capable = false
stackable = false

[ui]
top_tab = true
top_tab_label = "Top Bar"
top_tab_order = 5
builtin_view = "top_bar"

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["keyboard/geometry"]
publishes = ["layout/slots/top-bar", "layout/regions/dock-top-bar"]

[[settings]]
key = "slot_count"
label = "Number of Top Slots"
kind = "select"
default = "4"
options = ["4", "3", "2"]

[[settings]]
key = "module_dimming"
label = "Module Backdrop Dimming (%)"
kind = "number"
default = 28
min = 0
max = 85

[[settings]]
key = "show_dividers"
label = "Show Slot Dividers"
kind = "boolean"
default = true
