id = "dock-top-bar"
name = "Top Bar Dock"
version = "2.0.0"
description = "Provides the top-bar widget slot layout, optional frosted module dimming backdrop for readability, and vertical slot dividers (pure module—fork or replace for custom layouts!)"
author = "Keyglass"
category = "widget"
tags = ["core", "layout", "dock", "visibility", "dimming"]
provides = ["top_bar_dock"]
stages = ["under_key"]
host_requirement = "none"
slot_capable = false
stackable = false

license = "MIT OR Apache-2.0"
homepage = "https://github.com/keyglass-dev/keyglass/tree/main/modules/dock-top-bar"
repository = "https://github.com/keyglass-dev/keyglass"
support_url = "https://github.com/keyglass-dev/keyglass/issues"
discord_url = "https://discord.gg/keyglass"
changelog = "Core Keyglass v2 built-in module."

maturity = "stable"

[ui]
top_tab = true
top_tab_label = "Top Bar"
top_tab_order = 5
builtin_view = "top_bar"

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["keyboard/geometry", "layout/top_bar/occupancy"]
publishes = ["layout/slots/top-bar", "layout/regions/dock-top-bar"]

[[settings]]
key = "slot_count"
label = "Number of Top Slots"
kind = "select"
default = "4"
options = ["4", "3", "2"]

[[settings]]
key = "module_dimming"
label = "Top Bar Tint Dimming (%)"
kind = "number"
default = 30
min = 0
max = 80

[[settings]]
key = "show_dividers"
label = "Show Slot Dividers"
kind = "boolean"
default = true
