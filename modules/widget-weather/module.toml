id = "widget-weather"
name = "Weather Widget"
version = "2.0.0"
description = "Classic v1-style weather tile with city, local time, sunrise/sunset/AQI, temperature, condition icon, and 3-hour forecast"
author = "OpenFlux"
category = "widget"
tags = ["weather", "forecast", "aqi", "top-bar"]
stages = ["tile"]
host_requirement = "optional"
slot_capable = true
stackable = true

[top_bar]
supported_spans = [0.5, 1.0, 2.0]
default_span = 1.0
singleton = true

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["host/weather/current"]
publishes = []

[[settings]]
key = "city"
label = "City"
kind = "string"
default = "Denver"

[[settings]]
key = "celsius"
label = "Use Celsius"
kind = "boolean"
default = false

[[settings]]
key = "api_key"
label = "Optional Custom API Key"
kind = "string"
default = ""
secret = true
