id = "widget-media"
name = "Now Playing Widget"
version = "2.0.0"
description = "Displays live host media track, artist, animated equalizer, and playback progress"
author = "OpenFlux"
category = "widget"
tags = ["media", "music", "now-playing", "top-bar"]
stages = ["tile"]
host_requirement = "optional"
slot_capable = true
stackable = true

[top_bar]
supported_spans = [1.0, 2.0, 3.0]
default_span = 1.0
singleton = true

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["host/media/now_playing", "host/connection"]
publishes = []

[[settings]]
key = "accent"
label = "Accent Color"
kind = "color"
default = "#ff64b4"
