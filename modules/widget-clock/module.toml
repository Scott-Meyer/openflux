id = "widget-clock"
name = "Clock Widget"
version = "2.0.0"
description = "Classic v1-style sleek digital clock with large centered time, AM/PM, and uppercase date"
author = "OpenFlux"
category = "widget"
tags = ["clock", "time", "standalone", "top-bar"]
stages = ["tile"]
host_requirement = "none"
slot_capable = true
stackable = true

[top_bar]
supported_spans = [0.5, 1.0, 2.0]
default_span = 1.0
singleton = true

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["host/time"]
publishes = []

[[settings]]
key = "use_24h"
label = "24-Hour Clock"
kind = "boolean"
default = false
