id = "keys-keymap"
name = "Base Keymap Legends"
version = "2.0.0"
description = "Publishes base keycap legends with dynamic Shift case (a/A), shifted symbols (1/!), Caps Lock badge, and Fn layer media keys onto `keys/providers/keymap`"
author = "Keyglass"
category = "effect"
tags = ["keys", "core", "keymap", "shift", "fn"]
depends = [{ role = "keys_renderer" }]
stages = ["under_key", "world_overlay"]
host_requirement = "none"
slot_capable = false
stackable = true

license = "MIT OR Apache-2.0"
homepage = "https://github.com/keyglass-dev/keyglass/tree/main/modules/keys-keymap"
repository = "https://github.com/keyglass-dev/keyglass"
support_url = "https://github.com/keyglass-dev/keyglass/issues"
discord_url = "https://discord.gg/keyglass"
changelog = "Core Keyglass v2 built-in module."

maturity = "stable"

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["keyboard/state", "keyboard/keymap", "keyboard/resolved_keys", "keyboard/layer_names", "system/actions", "host/connection", "profiles/active"]
publishes = ["keys/providers/keymap", "keys/providers/keymap-caps"]

[[settings]]
key = "os_layout"
label = "Modifier Key Style"
kind = "select"
default = "auto"
options = ["auto", "macos", "windows", "linux"]

[[settings]]
key = "lowercase_default"
label = "Lowercase Letters When Unshifted"
kind = "boolean"
default = true

[[settings]]
key = "legend_visibility"
label = "Base Keycap Legends"
kind = "select"
default = "all"
options = ["all", "hide_letters", "layers_only", "hidden"]

[[settings]]
key = "layer_badge_enabled"
label = "Show Active Layer Badge on Keyboard"
kind = "boolean"
default = false

[[settings]]
key = "layer_badge_hide_base"
label = "Hide Layer Badge on Base Layer"
kind = "boolean"
default = false

[[settings]]
key = "layer_badge_x"
label = "Layer Badge Horizontal Position (0–1)"
kind = "number"
default = 0.90
min = 0.04
max = 0.96

[[settings]]
key = "layer_badge_y"
label = "Layer Badge Vertical Position (0–1)"
kind = "number"
default = 0.06
min = 0.03
max = 0.96

[[settings]]
key = "layer_badge_color"
label = "Layer Badge Accent Color"
kind = "color"
default = "#5ce1ff"
