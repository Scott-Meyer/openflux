id = "keys-keymap"
name = "Base Keymap Legends"
version = "2.0.0"
description = "Publishes base keycap legends with dynamic Shift case (a/A), shifted symbols (1/!), Caps Lock badge, and Fn layer media keys onto `keys/providers/keymap`"
author = "OpenFlux"
category = "effect"
tags = ["keys", "core", "keymap", "shift", "fn"]
depends = [{ role = "keys_renderer" }]
stages = ["under_key"]
host_requirement = "none"
slot_capable = false
stackable = true

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["keyboard/state", "keyboard/keymap", "keyboard/resolved_keys", "system/actions"]
publishes = ["keys/providers/keymap", "keys/providers/keymap-caps"]

[[settings]]
key = "lowercase_default"
label = "Lowercase Letters When Unshifted"
kind = "boolean"
default = true

[[settings]]
key = "legend_visibility"
label = "Base Keycap Legends"
kind = "select"
default = "all"
options = ["all", "hide_letters", "layers_only", "hidden"]
