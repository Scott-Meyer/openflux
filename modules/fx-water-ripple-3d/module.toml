id = "fx-water-ripple-3d"
name = "3D Water Ripple"
version = "2.0.0"
description = "Refracts the playing video or background with a real-time 2D wave simulation and specular highlights"
author = "OpenFlux"
category = "effect"
tags = ["3d", "water", "refraction", "ripple", "visual"]
stages = ["distortion"]
host_requirement = "none"
slot_capable = false
stackable = true

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["input/keys/event", "fx/surface/impulse"]
publishes = []

[[settings]]
key = "refraction"
label = "Refraction Strength"
kind = "number"
default = 38.0
min = 5.0
max = 120.0

[[settings]]
key = "specular"
label = "3D Highlight"
kind = "number"
default = 0.55
min = 0.0
max = 1.5

[[settings]]
key = "damping"
label = "Wave Persistence"
kind = "number"
default = 0.935
min = 0.88
max = 0.996

[[settings]]
key = "speed"
label = "Wave Speed"
kind = "number"
default = 0.76
min = 0.15
max = 0.85

[[settings]]
key = "tint"
label = "Specular Tint"
kind = "color"
default = "#9ce8ff"

[[actions]]
id = "test_ripple"
label = "Trigger Test Ripple"
topic = "fx/surface/impulse"
payload = { x = 960, y = 640, radius = 64, force = 1.2, kind = "ripple", source = "studio" }
