id = "fx-water-ripple-3d"
name = "3D Water Ripple"
version = "2.1.0"
description = "Refracts live video and backgrounds with a 60 Hz viscosity-damped water simulation (Ripple per key or Gentle Swell per key) and warm sunlit glints"
author = "OpenFlux"
category = "effect"
tags = ["3d", "water", "refraction", "ripple", "visual"]
stages = ["distortion"]
host_requirement = "none"
slot_capable = false
stackable = true

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["input/keys/event", "fx/surface/impulse"]
publishes = []

[[settings]]
key = "mode"
label = "Water Mode"
kind = "select"
default = "ripple"
options = ["ripple", "gentle"]

[[settings]]
key = "refraction"
label = "Refraction Strength"
kind = "number"
default = 25.0
min = 5.0
max = 60.0

[[settings]]
key = "specular"
label = "Sunlit Glint"
kind = "number"
default = 1.0
min = 0.0
max = 2.0

[[settings]]
key = "damping"
label = "Wave Persistence"
kind = "number"
default = 0.988
min = 0.95
max = 0.995

[[settings]]
key = "tint"
label = "Glint Color"
kind = "color"
default = "#ffdb9e"

[[actions]]
id = "test_ripple"
label = "Trigger Test Drop"
topic = "fx/surface/impulse"
payload = { x = 960, y = 640, radius = 46, force = 0.9, kind = "ripple", source = "studio" }
