id = "fx-key-particles"
name = "Key-Bouncing & Refracting Particles"
version = "2.0.0"
description = "Sparks burst upward, ricochet inside clear keycaps, then fall, pile up and spill off the sides"
author = "Keyglass"
category = "effect"
tags = ["key-press", "physics", "particles", "3d", "refraction", "visual"]
stages = ["under_key"]
host_requirement = "none"
slot_capable = false
stackable = true

license = "MIT OR Apache-2.0"
homepage = "https://github.com/keyglass-dev/keyglass/tree/main/modules/fx-key-particles"
repository = "https://github.com/keyglass-dev/keyglass"
support_url = "https://github.com/keyglass-dev/keyglass/issues"
discord_url = "https://discord.gg/keyglass"
changelog = "Core Keyglass v2 built-in module with open-cup key bounce physics."

maturity = "stable"

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["input/keys/event", "fx/surface/impulse"]
publishes = []

[[settings]]
key = "count"
label = "Average Dots Per Press"
kind = "number"
default = 3.5
min = 1
max = 20

[[settings]]
key = "bounce_chance"
label = "Inside Key Wall Bounce Probability"
kind = "number"
default = 0.8
min = 0.0
max = 1.0

[[settings]]
key = "lens_refract"
label = "Keycap Lens Magnification"
kind = "number"
default = 1.55
min = 1.0
max = 2.2

[[settings]]
key = "color_a"
label = "Primary Spark Color"
kind = "color"
default = "#ffd166"

[[settings]]
key = "color_b"
label = "Secondary Spark Color"
kind = "color"
default = "#4df0ff"
