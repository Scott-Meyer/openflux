id = "widget-prusa-connect"
name = "Prusa Connect"
version = "2.0.0"
description = "Shows live 3D printer telemetry (nozzle, bed, progress, ETA) in a top-bar slot and opens a live camera glance overlay while holding a key"
author = "OpenFlux"
category = "widget"
tags = ["3d-printer", "prusa", "camera", "telemetry", "rtsp", "top-bar"]
stages = ["background", "tile", "world_overlay"]
host_requirement = "required"
slot_capable = true
stackable = true

[top_bar]
supported_spans = [0.5, 1.0, 2.0]
default_span = 1.0
singleton = true

[entrypoints]
script = "script.lua"
host = "host/prusa_poller.py"

[channels]
subscribes = ["modules/prusa-connect/#", "modules/streams/prusa-cam", "input/keys/event", "keyboard/resolved_keys", "system/actions"]
publishes = ["modules/prusa-connect/peek", "modules/prusa-connect/status"]

[[settings]]
key = "printer_url"
label = "Prusa Connect / PrusaLink URL"
kind = "string"
default = "https://connect.prusa3d.com"

[[settings]]
key = "printer_uuid"
label = "Printer UUID (for Prusa Connect Cloud)"
kind = "string"
default = ""

[[settings]]
key = "api_token"
label = "API Token / Key"
kind = "string"
default = ""
secret = true

[[settings]]
key = "camera_url"
label = "Camera URL (Buddy3D rtsp://... or HTTP JPEG)"
kind = "string"
default = ""

[[settings]]
key = "peek_key_enabled"
label = "Enable Hold-to-Peek Camera Key"
kind = "boolean"
default = true

[[settings]]
key = "peek_key_index"
label = "Hold-to-Peek Camera Key"
kind = "key"
default = 13
min = 0
max = 84

[[settings]]
key = "video_while_printing"
label = "Show Live Video While Printing"
kind = "select"
default = "off"
options = ["off", "tile", "popup", "background"]

[[settings]]
key = "accent"
label = "Accent Color"
kind = "color"
default = "#fa6831"

[[settings]]
key = "poll_seconds"
label = "Telemetry Poll Interval (sec)"
kind = "number"
default = 5
min = 2
max = 60

[[actions]]
id = "camera_glance"
label = "Prusa Camera Glance"
short_label = ""
icon = "prusa-cam.png"
accent = "#fa6831"
mode = "hold"
topic = "modules/prusa-connect/peek"
retain = true
payload = { active = true }
release_payload = { active = false }

[[actions]]
id = "peek_on"
label = "Show Camera Preview"
topic = "modules/prusa-connect/peek"
retain = true
payload = { active = true }

[[actions]]
id = "peek_off"
label = "Hide Camera Preview"
topic = "modules/prusa-connect/peek"
retain = true
payload = { active = false }
