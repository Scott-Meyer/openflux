id = "keys-custom"
name = "Custom Keycap Visuals"
version = "2.0.0"
description = "Per-key and per-action visual overrides (custom labels, colors, borders, vector icons, and PNG images) layered cleanly above base keymap and shortcuts"
author = "Keyglass"
category = "effect"
tags = ["keys", "core", "icons", "custom", "keymap"]
depends = [{ role = "keys_renderer" }]
stages = ["under_key"]
host_requirement = "none"
slot_capable = false
stackable = true

license = "MIT OR Apache-2.0"
homepage = "https://github.com/keyglass-dev/keyglass/tree/main/modules/keys-custom"
repository = "https://github.com/keyglass-dev/keyglass"
support_url = "https://github.com/keyglass-dev/keyglass/issues"
discord_url = "https://discord.gg/keyglass"
changelog = "Core Keyglass v2 built-in module."

maturity = "stable"

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["keyboard/resolved_keys", "system/actions"]
publishes = ["keys/providers/custom"]
