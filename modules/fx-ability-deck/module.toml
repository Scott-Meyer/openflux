id = "fx-ability-deck"
name = "StreamDeck Ability Bar"
version = "2.0.0"
description = "Publishes live game abilities, sweeping cooldowns, charge counts, and Shift/Ctrl banks to `keys/providers/ability-deck` (100% transparent, zero-flash override)"
author = "OpenFlux"
category = "effect"
tags = ["gaming", "streamdeck", "abilities", "cooldowns", "keys"]
stages = ["under_key"]
host_requirement = "optional"
slot_capable = false
stackable = true

[entrypoints]
script = "script.lua"
host = "host/ability_sim.py"

[channels]
subscribes = ["input/keys/event", "host/app/active", "host/profile/active", "modules/ability-deck/#"]
publishes = ["keys/providers/ability-deck", "modules/ability-deck/cast", "fx/surface/impulse"]

[[settings]]
key = "app_filter"
label = "Only Show For Apps (comma-separated, blank = always)"
kind = "string"
default = ""

[[settings]]
key = "profile_filter"
label = "Only Show For Profile (blank = any)"
kind = "string"
default = ""

[[settings]]
key = "tile_bg"
label = "Show Translucent Key Plate"
kind = "boolean"
default = true

[[settings]]
key = "demo_activity"
label = "Simulate Live Cooldowns & Charges"
kind = "boolean"
default = true
