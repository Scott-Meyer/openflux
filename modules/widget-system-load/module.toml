id = "widget-system-load"
name = "System Load Widget"
version = "2.0.0"
description = "Hybrid CPU, RAM, and GPU telemetry bar that gracefully shows standalone status when host disconnects"
author = "OpenFlux"
category = "widget"
tags = ["system", "cpu", "gpu", "ram", "network", "telemetry", "top-bar"]
stages = ["tile"]
host_requirement = "optional"
slot_capable = true
stackable = true

[top_bar]
supported_spans = [0.5, 1.0, 2.0]
default_span = 1.0
singleton = true

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["host/system/metrics", "host/connection"]
publishes = []

[[settings]]
key = "accent"
label = "Bar Color"
kind = "color"
default = "#58f29c"
