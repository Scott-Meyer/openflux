id = "keys-renderer"
name = "Key Legends & Icons Renderer"
version = "2.0.0"
description = "Core modular key-face compositor: resolves all `keys/providers/#` claims (keymap, Shift case, v1 shortcuts, game ability decks) in one atomic zero-flash frame with full parallax alignment"
author = "Keyglass"
category = "effect"
tags = ["keys", "core", "legends", "parallax"]
provides = ["keys_renderer"]
stages = ["under_key"]
host_requirement = "none"
slot_capable = false
stackable = true

license = "MIT OR Apache-2.0"
homepage = "https://github.com/keyglass-dev/keyglass/tree/main/modules/keys-renderer"
repository = "https://github.com/keyglass-dev/keyglass"
support_url = "https://github.com/keyglass-dev/keyglass/issues"
discord_url = "https://discord.gg/keyglass"
changelog = "Core Keyglass v2 built-in module."

maturity = "stable"

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["keys/providers/#", "input/keys/event", "keyboard/state", "keyboard/geometry", "display/parallax", "keyboard/keymap", "host/app/active", "host/profile/active"]
publishes = ["layout/regions/keys", "layout/regions/slots"]

[[settings]]
key = "legend_style"
label = "Number & Symbol Shift Style"
kind = "select"
default = "dual_shift"
options = ["dual_shift", "swap"]

[[settings]]
key = "bold_legends"
label = "Crisp Bold Legends"
kind = "boolean"
default = true

[[settings]]
key = "legend_color"
label = "Default Legend Color"
kind = "color"
default = "#f2f7ff"

[[settings]]
key = "shortcut_color"
label = "Shortcut Icon Accent"
kind = "color"
default = "#5ce1ff"
