id = "keys-renderer"
name = "Key Legends & Icons Renderer"
version = "2.1.0"
description = "Core modular key-face compositor: resolves all `keys/providers/#` claims (keymap, Shift case, v1 shortcuts, game ability decks) in one atomic zero-flash frame with full parallax alignment"
author = "Keyglass"
category = "effect"
tags = ["keys", "core", "legends", "parallax"]
provides = ["keys_renderer"]
stages = ["under_key"]
host_requirement = "none"
slot_capable = false
stackable = true

license = "MIT OR Apache-2.0"
homepage = "https://github.com/keyglass-dev/keyglass/tree/main/modules/keys-renderer"
repository = "https://github.com/keyglass-dev/keyglass"
support_url = "https://github.com/keyglass-dev/keyglass/issues"
changelog = "v2.1.0: Detail stays centered or inset from the keycap edge: clock-sweep cooldown (curtain via cd_style), recharge ring (edge bar via progress_style), inset corner slots (rule.corners) with a bigger status dot, and a fading centered glow (rule.glow)."

maturity = "stable"

[entrypoints]
script = "script.lua"

[channels]
subscribes = ["keys/providers/#", "input/keys/event", "keyboard/state", "keyboard/geometry", "display/parallax", "keyboard/keymap", "host/app/active", "host/profile/active", "keyboard/resolved_keys", "system/actions", "host/connection", "keys/signal", "keys/inspect/request"]
publishes = ["layout/regions/keys", "layout/regions/slots", "keys/inspect/result"]

[[settings]]
key = "legend_style"
label = "Number & Symbol Shift Style"
kind = "select"
default = "dual_shift"
options = ["dual_shift", "swap"]

[[settings]]
key = "bold_legends"
label = "Crisp Bold Legends"
kind = "boolean"
default = true

[[settings]]
key = "legend_color"
label = "Default Legend Color"
kind = "color"
default = "#f2f7ff"

[[settings]]
key = "shortcut_color"
label = "Shortcut Icon Accent"
kind = "color"
default = "#5ce1ff"
