# Keyglass (OpenFlux) interface registry.
#
# Every boundary between independently released components is a named
# interface with a MAJOR.MINOR version. A minor bump only adds; a major bump
# breaks. Requirements are ranges within one major (">=2.0, <3.0"). The update
# engine reads these declarations from each release and only proposes updates
# that keep every component working. docs/compatibility.md explains the model.
#
# `openflux-release compat --compat compat.toml` checks this file.

schema = 1

[interfaces.bridge-usb]
version = "2.0"
kind = "protocol"
summary = "Host to bridge OFV2 priority-multiplexed USB protocol: full-duplex bus mirror, H.264 media streams, file sync, and packages."

[interfaces.firmware-usb]
version = "1.2"
kind = "protocol"
summary = "Host to firmware USB protocol: press refinement, Vial raw HID, dynamic XZ vial.json (0x73), Analog Gamepad config (0x74), layer override (0x75), and bootloader."

[interfaces.uart]
version = "2.0"
kind = "protocol"
summary = "Bridge to firmware serial link carrying key state, 1000 Hz analog travel, Flux/module actions, and live resolved QMK keycodes."

[interfaces.display-ipc]
version = "2.0"
kind = "protocol"
summary = "Bridge to pure-v2 display compositor channels (/tmp/openflux_bridge.sock + /tmp/openflux_v2.sock)."

[interfaces.keymap]
version = "2.1"
kind = "data"
summary = "QMK/Vial 16-layer EEPROM keymap stored in LittleFS. Action keycodes: QK_KB 0x7E00..0x7E3F plus QK_USER 0x7E40..0x7FFF (2.1 adds 0x7E60..0x7FFF), forwarded as slot = keycode - 0x7E00; 0x7E5F is Globe."

[interfaces.profile-settings]
version = "2.0"
kind = "data"
summary = "Per-profile actuation, default-layer, and Analog Gamepad settings stored by the firmware."

[interfaces.calibration-lfs]
version = "1.0"
kind = "data"
summary = "Per-unit Hall-effect sensor calibration files in the firmware's LittleFS partition (preserved across v1/v2/stock updates)."

[interfaces.config]
version = "2.0"
kind = "data"
summary = "Keyglass v2 modular runtime state, display_prefs.json (parallax, power, attachments), and profile overrides."

[components.host]
version = "2.0.0-beta.1"
provides = []
requires = { bridge-usb = ">=2.0, <3.0", firmware-usb = ">=1.0, <2.0", keymap = ">=2.0, <3.0", profile-settings = ">=2.0, <3.0", calibration-lfs = ">=1.0, <2.0", config = ">=2.0, <3.0" }

[components.firmware]
version = "2.0.0-beta.1"
provides = ["firmware-usb", "uart", "keymap", "profile-settings", "calibration-lfs"]
update-transport = ["firmware-usb"]

[components.bridge]
version = "2.0.0-beta.1"
provides = ["bridge-usb", "display-ipc"]
requires = { uart = ">=2.0, <3.0" }
update-transport = ["bridge-usb"]

[components.display]
version = "2.0.0-beta.1"
provides = ["config"]
requires = { display-ipc = ">=2.0, <3.0" }
update-transport = ["bridge-usb"]
