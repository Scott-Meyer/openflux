# Releases are made only here. release-please keeps one release pull request
# per component open on main. Merging a host PR tags and creates the public
# OpenFlux Studio GitHub release. Merging a keyboard PR (firmware, bridge or
# display) bumps its manifest version and tags it without creating a public
# GitHub release; its packages are published directly to GitHub Pages.
#
# Order when keyboard components and the host are released together: keyboard
# builds, then the index is published to GitHub Pages, then the host builds
# and bundles the keyboard software that was just published, then the index
# and Studio update feeds are published again. See docs/releasing.md.

name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      prs: ${{ steps.rp.outputs.prs }}
      host_created: ${{ steps.rp.outputs['host--release_created'] }}
      host_tag: ${{ steps.rp.outputs['host--tag_name'] }}
      firmware_created: ${{ steps.keyboard-tags.outputs.firmware_created }}
      firmware_tag: ${{ steps.keyboard-tags.outputs.firmware_tag }}
      bridge_created: ${{ steps.keyboard-tags.outputs.bridge_created }}
      bridge_tag: ${{ steps.keyboard-tags.outputs.bridge_tag }}
      display_created: ${{ steps.keyboard-tags.outputs.display_created }}
      display_tag: ${{ steps.keyboard-tags.outputs.display_tag }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Keyboard components use skip-github-release: true so they never create
      # public GitHub releases or steal the Latest badge from OpenFlux Studio.
      # Detect version bumps in .release-please-manifest.json and push their
      # git tags so the build workflows can check out and build them.
      - id: keyboard-tags
        run: |
          if git rev-parse -q --verify HEAD^1 >/dev/null 2>&1 && git cat-file -e HEAD^1:.release-please-manifest.json 2>/dev/null; then
            prev="$(git show HEAD^1:.release-please-manifest.json)"
          else
            prev='{}'
          fi
          curr="$(cat .release-please-manifest.json)"

          for entry in firmware:keyboard/firmware bridge:keyboard/bridge display:keyboard/display; do
            comp="${entry%%:*}"
            path="${entry#*:}"
            old_v="$(jq -r --arg p "$path" '.[$p] // ""' <<<"$prev")"
            new_v="$(jq -r --arg p "$path" '.[$p] // ""' <<<"$curr")"
            if [ -n "$new_v" ] && [ "$new_v" != "$old_v" ]; then
              tag="${comp}-v${new_v}"
              if [ -z "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
                git tag "$tag" HEAD
                git push origin "refs/tags/${tag}"
              fi
              echo "${comp}_created=true" >> "$GITHUB_OUTPUT"
              echo "${comp}_tag=${tag}" >> "$GITHUB_OUTPUT"
            else
              echo "${comp}_created=false" >> "$GITHUB_OUTPUT"
              echo "${comp}_tag=" >> "$GITHUB_OUTPUT"
            fi
          done

  # Release pull requests are opened with the default token, which does not
  # trigger CI on them. This checks what release-please edits: the version
  # files must keep Cargo.lock and compat.toml consistent.
  check-release-prs:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.release-please.outputs.prs).*.headBranchName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - name: Cargo.lock matches the versions
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: compat.toml is consistent
        run: cargo run --locked --release --manifest-path crates/openflux-update/Cargo.toml --bin openflux-release -- compat --compat compat.toml

  firmware:
    needs: release-please
    if: needs.release-please.outputs.firmware_created == 'true'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    uses: ./.github/workflows/release-firmware.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.firmware_tag }}

  bridge:
    needs: release-please
    if: needs.release-please.outputs.bridge_created == 'true'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    uses: ./.github/workflows/release-keyboard.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.bridge_tag }}

  display:
    needs: release-please
    if: needs.release-please.outputs.display_created == 'true'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    uses: ./.github/workflows/release-keyboard.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.display_tag }}

  # Publishes any keyboard releases that succeeded before the host build, so
  # that host installers bundle them.
  publish-keyboard:
    needs: [release-please, firmware, bridge, display]
    if: >-
      !cancelled() &&
      (needs.firmware.result == 'success' || needs.bridge.result == 'success' || needs.display.result == 'success')
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    uses: ./.github/workflows/publish-index.yml
    secrets: inherit
    with:
      staged-pattern: staged-keyboard-*

  # The host build bundles keyboard software from the published index, so it
  # waits for publish-keyboard. If a keyboard build of this run failed, the
  # host is not built either.
  host:
    needs: [release-please, firmware, bridge, display, publish-keyboard]
    if: >-
      !cancelled() &&
      needs.release-please.outputs.host_created == 'true' &&
      needs.firmware.result != 'failure' && needs.bridge.result != 'failure' && needs.display.result != 'failure' &&
      (needs.publish-keyboard.result == 'success' || needs.publish-keyboard.result == 'skipped')
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      pages: write
      deployments: write
    uses: ./.github/workflows/release-host.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.host_tag }}

  publish-host:
    needs: [host]
    if: ${{ !cancelled() && needs.host.result == 'success' }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    uses: ./.github/workflows/publish-index.yml
    secrets: inherit
    with:
      staged-pattern: staged-host
