# Builds and stages a firmware release (firmware-vX.Y.Z[-beta.N]).
#
# Called by release-please.yml when a firmware release PR is merged, or run
# by hand to rebuild an existing tag. Builds reproducibly twice inside
# keyboard/firmware/Dockerfile.build without network access and uploads a
# staged workflow artifact for publish-index.yml (hosted on GitHub Pages,
# not as a public GitHub release).

name: Release firmware

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish-index:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing firmware-v* tag to rebuild
        type: string
        required: true
      publish-index:
        description: Publish the update index afterwards
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        run: .github/scripts/release-meta.sh "$TAG"
        env:
          TAG: ${{ inputs.tag }}
          OPENFLUX_PAGES_URL: ${{ vars.OPENFLUX_PAGES_URL }}

      - name: Check component
        if: steps.meta.outputs.component != 'firmware'
        run: |
          echo "release-firmware builds firmware releases only" >&2
          exit 1

      - name: Host unit tests (ASan, UBSan)
        run: |
          make -C keyboard/firmware test \
            CFLAGS="-O1 -g -Wall -Wextra -Werror -std=c11 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Build environment
        run: docker build --pull=false -t openflux-firmware-build -f keyboard/firmware/Dockerfile.build keyboard/firmware

      - name: Build (twice, from clean trees)
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for n in 1 2; do
            rm -rf "build/firmware-$n"
            docker run --rm --network none -e SOURCE_DATE_EPOCH -v "$PWD:/work" -w /work openflux-firmware-build \
              sh -c "cmake -S keyboard/firmware -B build/firmware-$n -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENFLUX_VERSION=$VERSION && cmake --build build/firmware-$n"
          done
          uf2s=(build/firmware-1/*.uf2)
          [ "${#uf2s[@]}" -eq 1 ] && [ -f "${uf2s[0]}" ] || { echo "expected exactly one .uf2 in build/firmware-1" >&2; exit 1; }
          name="$(basename "${uf2s[0]}")"
          a="$(sha256sum "build/firmware-1/$name" | cut -d' ' -f1)"
          b="$(sha256sum "build/firmware-2/$name" | cut -d' ' -f1)"
          [ "$a" = "$b" ] || { echo "firmware build is not reproducible: $a vs $b" >&2; exit 1; }
          grep -qaF "$VERSION" "build/firmware-1/${name%.uf2}.bin" || { echo "${name%.uf2}.bin does not contain version $VERSION" >&2; exit 1; }
          mkdir -p staged/artifacts staged/source
          cp "build/firmware-1/$name" "staged/artifacts/openflux-firmware-$VERSION.uf2"
          ls -l staged/artifacts

      - name: Licenses of the linked code
        run: |
          .github/scripts/firmware-licenses.sh openflux-firmware-build staged/source/openflux-firmware-licenses.txt
          ls -l staged/source

      - name: Preflight and stage
        env:
          TAG: ${{ inputs.tag }}
          COMPONENT: ${{ steps.meta.outputs.component }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
          PAGES_URL: ${{ steps.meta.outputs.pages_url }}
          NOTES_URL: ${{ steps.meta.outputs.notes_url }}
        run: |
          cargo build --locked --release --manifest-path crates/openflux-update/Cargo.toml --bin openflux-release
          tool="$(cargo metadata --format-version 1 --no-deps --manifest-path crates/openflux-update/Cargo.toml | jq -r .target_directory)/release/openflux-release"
          "$tool" manifest --component "$COMPONENT" --version "$VERSION" --channel "$CHANNEL" \
            --compat compat.toml --artifact "staged/artifacts/openflux-firmware-${VERSION}.uf2" \
            --base-url "${PAGES_URL}/packages/${COMPONENT}/${VERSION}" --notes-url "$NOTES_URL" \
            -o "$RUNNER_TEMP/preflight-release.json"
          cp compat.toml staged/compat.toml
          jq -n \
            --arg component "$COMPONENT" \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg tag "$TAG" \
            --arg source_date_epoch "$EPOCH" \
            --arg notes_url "$NOTES_URL" \
            '{component: $component, version: $version, channel: $channel, tag: $tag, source_date_epoch: $source_date_epoch, notes_url: $notes_url}' \
            > staged/meta.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-keyboard-firmware
          path: staged
          retention-days: 7
          if-no-files-found: error

  publish-index:
    needs: build
    if: inputs.publish-index
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    uses: ./.github/workflows/publish-index.yml
    secrets: inherit
    with:
      staged-pattern: staged-keyboard-firmware
