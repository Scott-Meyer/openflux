# Builds and stages a keyboard package release: bridge-vX.Y.Z or
# display-vX.Y.Z (optionally -beta.N).
#
# Built natively on GitHub's arm64 runners in keyboard/<component>/
# Dockerfile.build. Reproducibility is checked by building twice from clean
# directories (.github/scripts/build-keyboard-packages.sh). Uploads a staged
# workflow artifact for publish-index.yml (hosted on GitHub Pages, not as a
# public GitHub release).

name: Release keyboard package

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish-index:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing bridge-v* or display-v* tag to rebuild
        type: string
        required: true
      publish-index:
        description: Publish the update index afterwards
        type: boolean
        default: true

permissions: {}

env:
  # Newest glibc symbol version the keyboard OS provides (display only; the
  # bridge and the display's keyglass-ffmpeg are fully static).
  KEYBOARD_GLIBC_MAX: "2.36"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        run: .github/scripts/release-meta.sh "$TAG"
        env:
          TAG: ${{ inputs.tag }}
          KEYGLASS_PAGES_URL: ${{ vars.KEYGLASS_PAGES_URL }}

      - name: Check component
        env:
          COMPONENT: ${{ steps.meta.outputs.component }}
        run: |
          case "$COMPONENT" in
            bridge|display) ;;
            *) echo "release-keyboard builds bridge and display, not $COMPONENT" >&2; exit 1 ;;
          esac

      - name: Build environment
        env:
          COMPONENT: ${{ steps.meta.outputs.component }}
        run: docker build -t "keyglass-$COMPONENT-build" -f "keyboard/$COMPONENT/Dockerfile.build" "keyboard/$COMPONENT"

      - name: Build (twice, from clean directories)
        env:
          COMPONENT: ${{ steps.meta.outputs.component }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
        run: .github/scripts/build-keyboard-packages.sh "$COMPONENT" "$VERSION" dist

      - name: Check packages
        env:
          COMPONENT: ${{ steps.meta.outputs.component }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          check=.github/scripts/check-keyboard-ipk.sh
          case "$COMPONENT" in
            bridge)
              "$check" "dist/artifacts/keyglass-bridge_${VERSION}_aarch64.ipk" keyglass-bridge "$VERSION" static \
                --require /usr/lib/keyglass/bridge/keyglass-bridge \
                --require /usr/lib/keyglass/bridge/restore-factory.sh \
                --require /usr/lib/keyglass/bridge/licenses/keyglass-bridge-rust-licenses.txt
              "$check" "dist/artifacts/keyglass-factory-restore_${VERSION}_aarch64.ipk" keyglass-factory-restore "$VERSION" static --no-executables
              ;;
            display)
              "$check" "dist/artifacts/keyglass-display_${VERSION}_aarch64.ipk" keyglass-display "$VERSION" glibc \
                --require /usr/lib/keyglass/display/keyglass-display \
                --require /usr/lib/keyglass/display/keyglass-ffmpeg \
                --require /usr/lib/keyglass/display/licenses/FFMPEG-LGPL-2.1.txt \
                --require /usr/lib/keyglass/display/licenses/FFMPEG-NOTICE.txt \
                --require /usr/lib/keyglass/display/licenses/keyglass-display-rust-licenses.txt
              compgen -G "dist/extra/keyglass-ffmpeg-source-*.tar.xz" > /dev/null ||
                { echo "the display build did not write the FFmpeg source archive" >&2; exit 1; }
              [ -f dist/extra/keyglass-ffmpeg-build.txt ] ||
                { echo "the display build did not write keyglass-ffmpeg-build.txt" >&2; exit 1; }
              ;;
          esac
          extra="$(find dist/artifacts -type f ! -name 'keyglass-*_aarch64.ipk')"
          [ -z "$extra" ] || { echo "unexpected files among the artifacts: $extra" >&2; exit 1; }

      - name: Preflight and stage
        env:
          TAG: ${{ inputs.tag }}
          COMPONENT: ${{ steps.meta.outputs.component }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
          PAGES_URL: ${{ steps.meta.outputs.pages_url }}
          NOTES_URL: ${{ steps.meta.outputs.notes_url }}
        run: |
          mkdir -p staged/artifacts
          cp dist/artifacts/* staged/artifacts/
          if [ "$COMPONENT" = display ]; then
            mkdir -p staged/source
            for f in dist/extra/keyglass-ffmpeg-source-*.tar.xz; do
              base="$(basename "$f")"
              cp "$f" "staged/source/${base/keyglass-ffmpeg-/keyglass-display-ffmpeg-}"
            done
            cp dist/extra/keyglass-ffmpeg-build.txt staged/source/keyglass-display-ffmpeg-build.txt
          fi

          cargo build --locked --release --manifest-path crates/keyglass-update/Cargo.toml --bin keyglass-release
          tool="$(cargo metadata --format-version 1 --no-deps --manifest-path crates/keyglass-update/Cargo.toml | jq -r .target_directory)/release/keyglass-release"
          args=()
          for f in staged/artifacts/*; do args+=(--artifact "$f"); done
          "$tool" manifest --component "$COMPONENT" --version "$VERSION" --channel "$CHANNEL" \
            --compat compat.toml "${args[@]}" \
            --base-url "${PAGES_URL}/packages/${COMPONENT}/${VERSION}" --notes-url "$NOTES_URL" \
            -o "$RUNNER_TEMP/preflight-release.json"

          cp compat.toml staged/compat.toml
          jq -n \
            --arg component "$COMPONENT" \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg tag "$TAG" \
            --arg source_date_epoch "$EPOCH" \
            --arg notes_url "$NOTES_URL" \
            '{component: $component, version: $version, channel: $channel, tag: $tag, source_date_epoch: $source_date_epoch, notes_url: $notes_url}' \
            > staged/meta.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-keyboard-${{ steps.meta.outputs.component }}
          path: staged
          retention-days: 7
          if-no-files-found: error

  publish-index:
    needs: build
    if: inputs.publish-index
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      deployments: write
    uses: ./.github/workflows/publish-index.yml
    secrets: inherit
    with:
      staged-pattern: staged-keyboard-*
