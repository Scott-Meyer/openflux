# Publishes the signed update index, keyboard packages, compliance source
# archives and Studio Tauri update feeds to GitHub Pages.
#
# Runs in the release-signing environment (branch-protected to main) where
# the release key and Tauri updater key live. Newly built releases arrive as
# workflow artifacts (staged-*), avoiding GitHub Release scraping and keeping
# public GitHub releases focused strictly on Keyglass Studio installers.
#
# Site layout:
#   index.json, index.json.sig            update index for keyglassd
#   site-manifest.json                    sha256 inventory of static files
#   packages/<component>/<version>/...    keyboard OTA packages (.uf2, .ipk)
#   updates/stable/latest.json (+ .app.tar.gz)  Tauri updater feed, stable
#   updates/beta/latest.json   (+ .app.tar.gz)  Tauri updater feed, beta
#   source/...                            GPL/LGPL FFmpeg source & licenses
#
# Called automatically after release builds, run by hand to withdraw a
# release, refresh the expiry or re-sign artifacts after a key rotation,
# and run monthly so the published index stays fresh.

name: Publish index

on:
  workflow_call:
    inputs:
      staged-pattern:
        type: string
        default: ""
      withdraw:
        type: string
        default: ""
      expires-days:
        type: number
        default: 365
      resign:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      staged-run-id:
        description: Optional workflow run ID to download staged-* artifacts from
        type: string
        default: ""
      staged-pattern:
        description: Artifact pattern when staged-run-id is set (e.g. staged-host)
        type: string
        default: ""
      withdraw:
        description: Releases to withdraw, space-separated <component>@<version>
        type: string
        default: ""
      expires-days:
        description: Days until the index expires
        type: number
        default: 365
      resign:
        description: Sign every published artifact again with the current release key (key rotation)
        type: boolean
        default: false
  schedule:
    - cron: "17 6 1 * *"

permissions: {}

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      sequence: ${{ steps.index.outputs.sequence }}
      sha256: ${{ steps.index.outputs.sha256 }}
      pages_url: ${{ steps.tool.outputs.pages_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      KEYGLASS_PAGES_URL: ${{ vars.KEYGLASS_PAGES_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download staged releases (current run)
        if: inputs.staged-pattern != '' && inputs.staged-run-id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.staged-pattern }}
          path: build/staged

      - name: Download staged releases (from run ID)
        if: inputs.staged-pattern != '' && inputs.staged-run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.staged-pattern }}
          run-id: ${{ inputs.staged-run-id }}
          github-token: ${{ github.token }}
          path: build/staged

      - name: Release tool
        id: tool
        run: |
          cargo build --locked --release --manifest-path crates/keyglass-update/Cargo.toml --bin keyglass-release --features production-keys
          dir="$(cargo metadata --format-version 1 --no-deps --manifest-path crates/keyglass-update/Cargo.toml | jq -r .target_directory)"
          echo "TOOL=$dir/release/keyglass-release" >> "$GITHUB_ENV"
          owner="${GITHUB_REPOSITORY%%/*}"
          pages="${KEYGLASS_PAGES_URL:-https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}}"
          echo "PAGES_URL=${pages%/}" >> "$GITHUB_ENV"
          echo "pages_url=${pages%/}" >> "$GITHUB_OUTPUT"

      - name: Last published sequence
        run: |
          recorded=""
          for attempt in 1 2 3; do
            if recorded="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=update-index&per_page=100" \
                --jq '[.[].payload.sequence? // 0 | tonumber? // 0] | max // 0')"; then
              break
            fi
            echo "attempt $attempt failed; retrying..." >&2
            sleep 5
          done
          [ -n "$recorded" ] || { echo "could not read last recorded index sequence" >&2; exit 1; }
          echo "Last recorded index sequence: $recorded"
          echo "RECORDED_SEQUENCE=$recorded" >> "$GITHUB_ENV"

      - name: Sign staged releases
        env:
          KEYGLASS_RELEASE_KEY: ${{ secrets.KEYGLASS_RELEASE_KEY }}
          KEYGLASS_RELEASE_KEY_PASSWORD: ${{ secrets.KEYGLASS_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p build/staged build/releases build/site
          .github/scripts/stage-releases.sh \
            --tool "$TOOL" \
            --staged build/staged \
            --pages-url "$PAGES_URL" \
            --active-pubkey host/packaging/keys/active-release.pub \
            --releases-out build/releases \
            --site-out build/site

      - name: Index
        id: index
        env:
          KEYGLASS_RELEASE_KEY: ${{ secrets.KEYGLASS_RELEASE_KEY }}
          KEYGLASS_RELEASE_KEY_PASSWORD: ${{ secrets.KEYGLASS_RELEASE_KEY_PASSWORD }}
          WITHDRAW: ${{ inputs.withdraw }}
          EXPIRES_DAYS: ${{ inputs.expires-days || 365 }}
          RESIGN: ${{ inputs.resign && 'true' || 'false' }}
        run: |
          args=()
          [ "$RESIGN" = true ] && args+=(--resign)
          .github/scripts/build-index.sh --tool "$TOOL" --pages-url "$PAGES_URL" --releases build/releases \
            --keys host/packaging/keys --factory factory-reference.toml \
            --recorded-sequence "$RECORDED_SEQUENCE" --expires-days "$EXPIRES_DAYS" \
            --withdraw "$WITHDRAW" "${args[@]}" -o build/site

      - name: Studio update feeds
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=()
          staged_host=""
          while IFS= read -r meta; do
            if [ "$(jq -r '.component' "$meta")" = host ]; then
              staged_host="$(dirname "$meta")"
            fi
          done < <(find build/staged -name meta.json | LC_ALL=C sort)
          if [ -n "$staged_host" ]; then
            echo "Using staged host directory: $staged_host"
            extra+=(--staged-host "$staged_host")
          fi
          for feed in stable beta; do
            .github/scripts/tauri-feed.py \
              --index build/site/index.json \
              --feed "$feed" \
              --pages-url "$PAGES_URL" \
              --site build/site \
              --work build/feed-downloads \
              "${extra[@]}" \
              -o "build/site/updates/$feed/latest.json"
          done
          if [ -n "$staged_host" ]; then
            staged_ch="$(jq -er '.channel' "$staged_host/meta.json")"
            staged_ver="$(jq -er '.version' "$staged_host/meta.json")"
            [ -f "build/site/updates/${staged_ch}/latest.json" ] || { echo "missing Tauri feed for staged host ${staged_ver}" >&2; exit 1; }
            feed_ver="$(jq -er '.version' "build/site/updates/${staged_ch}/latest.json")"
            [ "$feed_ver" = "$staged_ver" ] || { echo "Tauri ${staged_ch} feed has ${feed_ver}, expected ${staged_ver}" >&2; exit 1; }
          fi
          .github/scripts/write-site-manifest.sh build/site
          touch build/site/.nojekyll
          find build/site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          retention-days: 90

  deploy:
    needs: sign
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_URL: ${{ needs.sign.outputs.pages_url }}
      SEQUENCE: ${{ needs.sign.outputs.sequence }}
      SHA256: ${{ needs.sign.outputs.sha256 }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: The live site serves the new index
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
                --output live-index.json "$PAGES_URL/index.json?fresh=$SEQUENCE-$attempt-$RANDOM"; then
              live_sequence="$(jq -r '.sequence' live-index.json 2>/dev/null || echo none)"
              live_sha="$(sha256sum live-index.json | cut -d' ' -f1)"
              if [ "$live_sha" = "$SHA256" ]; then
                echo "$PAGES_URL/index.json serves sequence $SEQUENCE"
                exit 0
              fi
              echo "attempt $attempt: the site serves sequence $live_sequence; waiting for $SEQUENCE"
            fi
            sleep 15
          done
          echo "::error::$PAGES_URL/index.json does not serve sequence $SEQUENCE after 10 minutes" >&2
          exit 1
      - name: Record the published sequence
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          id=""
          for attempt in 1 2 3; do
            if id="$(jq -n --arg ref "$GITHUB_SHA" --argjson sequence "$SEQUENCE" --arg sha256 "$SHA256" --arg run "$run" \
              '{ref: $ref, environment: "update-index", auto_merge: false, required_contexts: [],
                description: "update index sequence \($sequence)",
                payload: {sequence: $sequence, sha256: $sha256, run: $run}}' \
              | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"; then
              break
            fi
            echo "attempt $attempt failed; retrying..." >&2
            sleep 5
          done
          [ -n "$id" ] || { echo "could not record index sequence deployment" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success \
            -f environment_url="$PAGES_URL/index.json" -f log_url="$run" -f description="sequence $SEQUENCE" > /dev/null
          echo "Recorded index sequence $SEQUENCE (deployment $id)"
