# Uploads a component's built files to its GitHub release. Files already on
# the release are never replaced: an identical file is skipped, a different
# one fails the upload (published artifacts are immutable; cut a new version).
#
# The artifacts (the files the update index lists) are recorded in
# artifacts.txt. They are not signed here: the release key exists only in the
# release-signing environment, where publish-index.yml signs each artifact,
# writes release.json and publishes the index. A preflight manifest is
# written here, without signatures, so a release whose compat.toml or files
# are wrong fails before it reaches that approval.
#
# Expects the repository checked out at the release tag and the release to
# exist (release-please creates it).

name: Publish release assets
description: Checksums, provenance attestation and upload of release files
inputs:
  tag:
    description: Release tag
    required: true
  component:
    description: host, firmware, bridge or display
    required: true
  version:
    description: Release version
    required: true
  channel:
    description: stable or beta
    required: true
  release-url:
    description: URL the release's files are downloaded from
    required: true
  notes-url:
    description: Release notes URL
    required: true
  artifacts:
    description: Directory holding the artifacts listed in the update index
    required: true
  extra:
    description: Directory holding other release files (sources, SBOM, build info); may be empty
    required: false
    default: ""
  github-token:
    description: Token with contents write access
    required: true
runs:
  using: composite
  steps:
    - name: Preflight manifest
      shell: bash
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
        COMPONENT: ${{ inputs.component }}
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
        RELEASE_URL: ${{ inputs.release-url }}
        NOTES_URL: ${{ inputs.notes-url }}
      run: |
        cargo build --locked --release --manifest-path crates/openflux-update/Cargo.toml --bin openflux-release
        tool="$(cargo metadata --format-version 1 --no-deps --manifest-path crates/openflux-update/Cargo.toml | jq -r .target_directory)/release/openflux-release"
        args=()
        for f in "$ARTIFACTS"/*; do args+=(--artifact "$f"); done
        [ "${#args[@]}" -gt 0 ] || { echo "no artifacts in $ARTIFACTS" >&2; exit 1; }
        "$tool" manifest --component "$COMPONENT" --version "$VERSION" --channel "$CHANNEL" \
          --compat compat.toml "${args[@]}" --base-url "$RELEASE_URL" --notes-url "$NOTES_URL" \
          -o "$RUNNER_TEMP/preflight-release.json"
        (cd "$ARTIFACTS" && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort) > "$RUNNER_TEMP/artifacts.txt"
    - name: Checksums
      shell: bash
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
        EXTRA: ${{ inputs.extra }}
      run: |
        stage="$RUNNER_TEMP/release-files"
        rm -rf "$stage" && mkdir -p "$stage"
        cp "$ARTIFACTS"/* "$stage/"
        if [ -n "$EXTRA" ] && [ -d "$EXTRA" ]; then
          for f in "$EXTRA"/*; do
            [ -f "$f" ] || continue
            [ ! -e "$stage/$(basename "$f")" ] || { echo "$(basename "$f") is both an artifact and an extra file" >&2; exit 1; }
            cp "$f" "$stage/"
          done
        fi
        cp "$RUNNER_TEMP/artifacts.txt" "$stage/"
        (cd "$stage" && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
        cat "$stage/SHA256SUMS"
    - name: Provenance attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: ${{ runner.temp }}/release-files/SHA256SUMS
    - name: Upload to the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
      run: |
        # Published files are never replaced. artifacts.txt goes last: it is
        # what tells the publish workflow that the build has finished.
        stage="$RUNNER_TEMP/release-files"
        files=()
        while IFS= read -r f; do files+=("$stage/$f"); done < <(cd "$stage" && find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name artifacts.txt -printf '%f\n' | LC_ALL=C sort)
        "$GITHUB_ACTION_PATH/../../scripts/upload-release-assets.sh" "$TAG" "${files[@]}" "$stage/SHA256SUMS" "$stage/artifacts.txt"
