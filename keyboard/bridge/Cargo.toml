[package]
name = "keyglass-bridge"
version = "2.0.0-beta.1"
edition.workspace = true
description = "Keyglass keyboard bridge: USB gadget, key-scanner UART link, and display IPC"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
libc = "0.2"
keyglass-bus = { path = "../../crates/keyglass-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "keyglass-bridge"
path = "src/bin/keyglass_bridge.rs"
