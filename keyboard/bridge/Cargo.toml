[package]
name = "openflux-bridge"
version = "2.3.1"
edition.workspace = true
description = "OpenFlux keyboard bridge: USB gadget, key-scanner UART link, and display IPC"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
libc = "0.2"
openflux-bus = { path = "../../crates/openflux-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "openflux-bridge"
path = "src/bin/openflux_bridge.rs"
