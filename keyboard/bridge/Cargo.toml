[package]
name = "openflux-bridge"
version = "1.0.1"
edition.workspace = true
description = "OpenFlux keyboard bridge: USB gadget, key-scanner UART link, and display IPC"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "openflux-bridge"
path = "src/bin/openflux_bridge.rs"
