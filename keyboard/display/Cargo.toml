[package]
name = "keyglass-display"
version = "2.0.0-beta.1"
edition.workspace = true
description = "Keyglass keyboard display: 1920x1080 Wayland renderer, also used for desktop previews"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "keyglass_display"
path = "src/lib.rs"

[[bin]]
name = "keyglass-display"
path = "src/bin/keyglass_display.rs"

[dependencies]
crc32fast = "1"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
keyglass-bus = { path = "../../crates/keyglass-bus" }
keyglass-compositor = { path = "../../crates/keyglass-compositor", default-features = false }
keyglass-modules = { path = "../../crates/keyglass-modules" }
resvg = { version = "0.50", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client"] }
