[workspace]
resolver = "2"
members = [
    "crates/openflux-bus",
    "crates/openflux-modules",
    "crates/openflux-compositor",
    "crates/fluxctl",
    "crates/openflux-update",
    "host/daemon",
    "host/studio/src-tauri",
    "keyboard/bridge",
    "keyboard/display",
]
exclude = [
    "tools/openflux-dev/lfs-tool",
]

[workspace.package]
version = "2.0.0-beta.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/keyglass-dev/keyglass"
rust-version = "1.90"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

# The daemon and bridge run continuously on the host and keyboard; favor small binaries.
[profile.release.package.openfluxd]
opt-level = "z"

[profile.release.package.openflux-bridge]
opt-level = "z"
