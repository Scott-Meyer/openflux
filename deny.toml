# cargo-deny policy for every Rust crate in this repository, run by CI
# (`cargo deny --config deny.toml check licenses advisories bans sources`).

[graph]
all-features = true

[advisories]
# Every RustSec vulnerability in a dependency fails the check, as do yanked
# crates and unmaintained crates the workspace depends on directly. An ignore
# entry needs the advisory ID and the reason it does not apply.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Licenses compatible with distributing Keyglass under MIT OR Apache-2.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
